name: Generate contribution snake

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2334D399&color_dots=%23E2E8F0,%23BAE6FD,%237DD3FC,%2338BDF8,%230EA5E9
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2334D399&color_dots=%2307111F,%230C4A6E,%230369A1,%230EA5E9,%2338BDF8

      - name: Publish animations to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
