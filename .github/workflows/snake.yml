name: Generate contribution snake

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A95C13&color_dots=%23E7EEF1,%23BEDDDA,%2389C0BE,%23458991,%23285268
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23F2C879&color_dots=%23101D2C,%231D3D4B,%232C6774,%234A949C,%2395D5C9

      - name: Publish animations to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
