<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-labelledby="title desc">
  <title id="title">GoKo's embedded systems: RISC-V, RTOS and ARMv7-A</title>
  <desc id="desc">Blue signal traces connect SpacemiT K1 driver work and Cortex-A9 porting to a central RTOS chip above the curve of a planet.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1200" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040910"/><stop offset=".46" stop-color="#0A1829"/><stop offset="1" stop-color="#102B4D"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0" cy="0" r="1" gradientTransform="translate(1030 278) rotate(-12) scale(540 198)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B5F98" stop-opacity=".54"/><stop offset="1" stop-color="#2B5F98" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="120" y1="249" x2="1200" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#244975" stop-opacity="0"/><stop offset=".55" stop-color="#4277A9"/><stop offset=".88" stop-color="#A5C8ED"/><stop offset="1" stop-color="#5899D3"/>
    </linearGradient>
    <linearGradient id="package" x1="455" y1="48" x2="746" y2="221" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B3554"/><stop offset=".42" stop-color="#102339"/><stop offset="1" stop-color="#0B1728"/>
    </linearGradient>
    <linearGradient id="bevel" x1="445" y1="63" x2="750" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#94B8DF"/><stop offset=".42" stop-color="#406591"/><stop offset="1" stop-color="#567FAB"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="272" rx="18"/></clipPath>
    <path id="horizon" d="M145 346Q752 356 1228 194"/>
    <g id="traces" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M291 84C342 84 349 100 389 100H431" stroke="#5685B4" stroke-width="1.7"/>
      <path d="M271 134C332 134 355 123 396 123H431" stroke="#86B1DA" stroke-width="2.1"/>
      <path d="M296 181C356 181 356 147 400 147H431" stroke="#5887B7" stroke-width="1.7"/>
      <path d="M323 198C373 198 373 170 404 170H431" stroke="#3B638B" stroke-width="1.3"/>
      <g fill="#0C1A2A" stroke="#89ADD2" stroke-width="1.6">
        <circle cx="291" cy="84" r="3.2"/><circle cx="271" cy="134" r="4"/><circle cx="296" cy="181" r="3.2"/>
      </g>
    </g>
    <g id="contacts" fill="#759AC0">
      <rect x="428" y="97" width="20" height="6" rx="2"/><rect x="428" y="120" width="20" height="6" rx="2"/>
      <rect x="428" y="144" width="20" height="6" rx="2"/><rect x="428" y="167" width="20" height="6" rx="2"/>
    </g>
    <style>
      text { text-anchor: middle; font-family: system-ui, sans-serif; }
      .arch { fill: #DBE9F9; font-size: 37px; font-weight: 600; }
      .core { fill: #F1F5FB; font-size: 59px; font-weight: 650; letter-spacing: 1px; }
      .caption, .model, .legend { font-family: ui-monospace, "DejaVu Sans Mono", monospace; }
      .caption { fill: #C0D5EC; font-size: 17px; letter-spacing: 2px; }
      .model { fill: #CBDEF2; font-size: 18px; }
      .legend { fill: #A2BAD4; font-size: 15px; }
      @media (max-width: 550px) {
        .detail { display: none; }
        .arch { font-size: 46px; }
        .core { font-size: 73px; }
        .model { font-size: 32px; }
        .caption { font-size: 30px; letter-spacing: 1px; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="272" fill="url(#night)"/>
    <rect width="1200" height="272" fill="url(#bloom)"/>
    <g fill="none" stroke-linecap="round" stroke="#B8CCE4">
      <path d="M35 73h.1m54-42h.1M223 45h.1M324 34h.1M374 70h.1M472 25h.1M688 32h.1M778 48h.1M848 26h.1M933 53h.1M1068 23h.1M1156 93h.1M39 207h.1M92 245h.1M382 222h.1M746 236h.1M863 210h.1M1178 232h.1" opacity=".44" stroke-width="1.7"/>
      <path d="M136 45h.1M353 52h.1M797 32h.1M1116 55h.1M296 229h.1M819 228h.1" opacity=".65" stroke-width="2.5"/>
    </g>
    <path d="M145 346Q752 356 1228 194V360H145Z" fill="#071320"/>
    <use href="#horizon" fill="none" stroke="url(#rim)" stroke-width="9" opacity=".12"/>
    <use href="#horizon" fill="none" stroke="url(#rim)" stroke-width="2" opacity=".78"/>

    <use href="#traces"/><use href="#traces" transform="translate(1200) scale(-1 1)"/>
    <use href="#contacts"/><use href="#contacts" transform="translate(1200) scale(-1 1)"/>

    <rect x="447" y="48" width="306" height="176" rx="23" fill="#030912" opacity=".54"/>
    <rect x="447" y="43" width="306" height="176" rx="23" fill="url(#package)" stroke="url(#bevel)" stroke-width="2"/>
    <rect x="460" y="56" width="280" height="150" rx="14" fill="#0B1829" stroke="#345170"/>
    <circle cx="474" cy="70" r="2.5" fill="#94B6D9"/>
    <text class="legend detail" x="600" y="91" letter-spacing="2.9">SYSTEM CORE</text>
    <text class="core" x="600" y="151">RTOS</text>
    <text class="caption" x="600" y="183">BSP / PORTING</text>

    <g>
      <text class="legend detail" x="168" y="84" letter-spacing="1.7">I/O DRIVERS</text>
      <text class="arch" x="168" y="135">RISC-V</text>
      <rect x="66" y="148" width="204" height="39" rx="19.5" fill="#102238" stroke="#365778"/>
      <text class="model" x="168" y="174">SpacemiT K1</text>
      <text class="legend detail" x="168" y="213">I²C · I²S · IOMMU</text>
    </g>
    <g>
      <text class="legend detail" x="1032" y="84" letter-spacing="1.7">KERNEL PORT</text>
      <text class="arch" x="1032" y="135">ARMv7-A</text>
      <rect x="930" y="148" width="204" height="39" rx="19.5" fill="#102238" stroke="#365778"/>
      <text class="model" x="1032" y="174">Cortex-A9</text>
      <text class="legend detail" x="1032" y="213">IRQ · GIC · TIMER</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="270.5" rx="17.25" fill="none" stroke="#355171" stroke-opacity=".78" stroke-width="1.5"/>
</svg>

